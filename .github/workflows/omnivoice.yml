name: OmniVoice Urdu relay
on:
  push:
    paths: ["scripts_ov/**.json", "voices/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: omnivoice
  cancel-in-progress: false
jobs:
  ov:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: "pip" }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-omnivoice-v1
      - run: |
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install omnivoice==0.2.1 soundfile
      - run: python tools/ov_relay.py
      - name: Commit audio
        run: |
          git config user.name "voice-relay"
          git config user.email "actions@users.noreply.github.com"
          git add audio
          git diff --cached --quiet || git commit -m "OmniVoice clips [skip ci]"
          git pull --rebase -q || true
          git push
