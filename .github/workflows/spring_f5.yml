name: SPRING_F5 Urdu relay
on:
  push:
    paths: ["scripts_f5/**.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: spring_f5
  cancel-in-progress: false
jobs:
  f5:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-spring-f5-v1
      - run: |
          sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install git+https://github.com/ArigalaAdarsh/SPRING_F5.git soundfile
      - run: python tools/f5_relay.py
      - name: Commit audio
        run: |
          git config user.name "voice-relay"
          git config user.email "actions@users.noreply.github.com"
          git add audio
          git diff --cached --quiet || git commit -m "SPRING_F5 clips [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
